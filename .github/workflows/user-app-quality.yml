name: User App Quality

on:
  push:
    paths:
      - 'apps/user-app/**'
      - 'packages/ui-components/**'
      - 'scripts/scan-cjk-residual.mjs'
  pull_request:
    paths:
      - 'apps/user-app/**'
      - 'packages/ui-components/**'
      - 'scripts/scan-cjk-residual.mjs'

jobs:
  cjk-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan Chinese residuals in H5 sources
        run: node scripts/scan-cjk-residual.mjs
